name: Build Documentation
# Validation branch only: build the documentation without Pages deployment.
on:
  workflow_call:
    inputs:
      deploy:
        type: boolean
        description: Deploy to GitHub Pages
        default: false
jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Doxygen
        uses: ssciwr/doxygen-install@fa3e94d34131d3990b6b8ba939ab982964aa3758 # v2.0.3
        with: { version: "1.14.0" }
      - name: Build
        run: cd docs && doxygen
